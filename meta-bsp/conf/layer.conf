# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mmgr-bsp"
BBFILE_PATTERN_mmgr-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_mmgr-bsp = "7"
LAYERVERSION_mmgr-bsp = "4"
LAYERSERIES_COMPAT_mmgr-bsp = "scarthgap"
